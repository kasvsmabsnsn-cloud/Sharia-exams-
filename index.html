            animation: turbo-spin-reverse 0.3s linear infinite;
        }

        @keyframes turbo-spin-reverse {

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }

            font-weight: 600;

            min-width: 50px;
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: height 0.2s;
        }
        .progress-track:hover {
            height: 14px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f97316, #3b82f6);
            border-radius: 10px;
            transition: width 0.05s linear;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -6px;
            width: 22px;
            height: 22px;
            background: #f97316;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 20px rgba(249,115,22,0.6);
        }
        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 8px;
        }
        .controls-row button {
            background: transparent;

            border: 1px solid transparent;

            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.1);

            border-radius: 50%;
            background: #f97316;

            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f97316;
            cursor: pointer;
            border: none;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;

        .toast {

            padding: 8px 20px;
            border-radius: 40px;

            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
            white-space: nowrap;
            direction: ltr;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

            pointer-events: none;

        .exam-btn-active {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);

                const current = snapshot.val() || { totalPoints: 0, examsCount: 0 };
                
                await db.ref('leaderboard/' + deviceId).set({
                    name: userData.name || 'مستخدم',
                    phone: userData.phone || '---',

                return false;

        // جلب ترتيب المستخدم
        async function getUserRank(deviceId) {
            try {
                const db = firebase.database();
                const snapshot = await db.ref('leaderboard').orderByChild('totalPoints').limitToLast(100).once('value');
                const users = [];
                snapshot.forEach(child => {
                    users.push({
                        id: child.key,
                        ...child.val()
                    });
                });
                users.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));
                
                const index = users.findIndex(u => u.id === deviceId);
                return index + 1;
            } catch (error) {
                console.error('Error getting user rank:', error);
                return null;
            }
        }

        // دالة مراقبة التغييرات (WATCH ONLY - Listener واحد فقط)
        function watchLeaderboard(callback) {
            if (leaderboardWatcherStarted) {
                console.log('ℹ️ Leaderboard watcher already running, reusing existing listener.');
                if (callback && typeof callback === 'function') {
                    leaderboardCallback = callback;
                }
                return;
            }
            
            try {
                ensureFirebaseInit();
                const db = firebase.database();
                
                leaderboardWatcherRef = db.ref('leaderboard')
                    .orderByChild('totalPoints')
                    .limitToLast(5);
                
                if (callback && typeof callback === 'function') {
                    leaderboardCallback = callback;
                }
                
                leaderboardWatcherRef.on('value', (snapshot) => {
                    try {
                        const users = [];
                        snapshot.forEach(child => {
                            users.push({
                                id: child.key,
                                ...child.val()
                            });
                        });
                        users.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));
                        
                        if (leaderboardCallback && typeof leaderboardCallback === 'function') {
                            leaderboardCallback(users);
                        } else {
                            renderLeaderboard(users);
                        }
                        
                    } catch (error) {
                        console.error('Error in leaderboard watcher callback:', error);
                    }
                });
                
                leaderboardWatcherStarted = true;
                console.log('✅ Leaderboard watcher started successfully (single listener)');
                
            } catch (error) {
                console.error('Error starting leaderboard watcher:', error);
            }
        }

        // دالة إزالة الـ Listener
        function stopLeaderboardWatcher() {
            if (leaderboardWatcherStarted && leaderboardWatcherRef) {
                try {
                    leaderboardWatcherRef.off('value');
                    leaderboardWatcherStarted = false;
                    leaderboardWatcherRef = null;
                    leaderboardCallback = null;
                    console.log('✅ Leaderboard watcher stopped successfully');
                } catch (error) {
                    console.error('Error stopping leaderboard watcher:', error);
                }
            }
        }

        // دالة التهيئة الرئيسية
        function initLeaderboard() {
            loadLeaderboard();
            watchLeaderboard((users) => {
                renderLeaderboard(users);
            });
        }

            function observeCards() {
                const cards = document.querySelectorAll('[data-card]');
                if (!cards.length) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.remove('card-hidden');
                            entry.target.classList.add('card-visible');
                        } else {
                            entry.target.classList.remove('card-visible');
                            entry.target.classList.add('card-hidden');
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px'
                });

                cards.forEach(card => observer.observe(card));
            }

            function renderAIChat() {
                const faqData = [
                    { q: "ما هي المعادلة التكميلية الفرنسية؟", a: "المعادلة التكميلية الفرنسية هي اختبار يقدمه المجلس الأعلى للجامعات لطلبة كلية الحقوق، ويتضمن مواد: قانون مدني، قانون تجاري، قانون جنائي، وقانون إداري، بالإضافة إلى اللغة الفرنسية القانونية." },
                    { q: "ما هي المواد المطلوبة في المعادلة؟", a: "المواد المطلوبة هي: القانون المدني، القانون التجاري، القانون الجنائي، القانون الإداري، واللغة الفرنسية (مصطلحات قانونية وترجمة)." },
                    { q: "كم عدد الأسئلة في امتحان المعادلة؟", a: "يتكون الامتحان من 40 سؤالاً موزعة على المواد المختلفة، منها أسئلة اختيار من متعدد وأسئلة صح/خطأ." },
                    { q: "هل يوجد كتب أو ملازم للمعادلة؟", a: "نعم، تتوفر ملازم شرح للمواد الخمس باللغتين العربية والفرنسية، بالإضافة إلى كتيبات مصطلحات قانونية." },
                    { q: "كيف يمكنني الاشتراك في دورة المعادلة؟", a: "يمكنك الاشتراك عبر التواصل مع د. مصطفى محمود على واتساب: 201146681064، وسيتم تزويدك بكل التفاصيل." },
                    { q: "ما هو نظام الامتحان؟", a: "الامتحان عبارة عن 40 سؤالاً اختيار من متعدد، ويتم التصحيح إلكترونياً، وتظهر النتيجة فور الانتهاء." },
                    { q: "هل الشهادة معترف بها؟", a: "نعم، شهادة المعادلة التكميلية معترف بها من المجلس الأعلى للجامعات وتعادل سنة دراسية كاملة." },
                    { q: "متى موعد الامتحان؟", a: "موعد الامتحان يحدده المجلس الأعلى للجامعات، ويتم الإعلان عنه عادة في بداية كل فصل دراسي." }
                ];

                function findAnswer(question) {
                    const lowerQ = question.trim().toLowerCase();
                    for (let item of faqData) {
                        if (item.q.includes(lowerQ) || lowerQ.includes(item.q.toLowerCase())) {
                            return item.a;
                        }
                    }
                    const keywords = ["مواد", "امتحان", "اشتراك", "شهادة", "موعد", "نظام", "كتب", "ملازم", "مصطلحات", "ترجمة", "مدني", "تجاري", "جنائي", "إداري"];
                    for (let kw of keywords) {
                        if (lowerQ.includes(kw)) {
                            return "يمكنك الاطلاع على الأسئلة المقترحة أدناه، أو توضيح سؤالك بشكل أكثر دقة.";
                        }
                    }
                    return null;
                }

                function typeMessage(element, text, speed = 20) {
                    element.textContent = '';
                    let i = 0;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            element.textContent += text.charAt(i);
                            i++;
                            const container = document.getElementById('aiChatMessages');
                            if (container) container.scrollTop = container.scrollHeight;
                        } else {
                            clearInterval(interval);
                        }
                    }, speed);
                    return interval;
                }

                function addMessage(sender, text) {
                    const container = document.getElementById('aiChatMessages');
                    if (!container) return;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `ai-chat-message ${sender}`;
                    msgDiv.style.flexShrink = '0';

                        msgDiv.innerHTML = `<span>${text}</span>`;
                    } else {
                        typeMessage(msgDiv, text);
                    }
                    container.scrollTop = container.scrollHeight;
                }

                window.handleSendQuestion = function() {
                    const input = document.getElementById('aiChatInput');
                    const question = input.value.trim();
                    if (!question) return;
                    addMessage('user', question);
                    input.value = '';
                    const answer = findAnswer(question);
                    if (answer) {
                        setTimeout(() => addMessage('bot', answer), 300);
                    } else {
                        setTimeout(() => {
                            addMessage('bot', '❌ عذراً، لم أجد إجابة محددة لسؤالك. يمكنك الاختيار من الأسئلة المقترحة أعلاه أو إعادة صياغة السؤال.');
                        }, 300);
                    }
                };

                window.askSuggested = function(q) {
                    const input = document.getElementById('aiChatInput');
                    input.value = q;
                    window.handleSendQuestion();

                return `
                <div id="aiChatContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,10,20,0.92); backdrop-filter: blur(20px); z-index: 50; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow: hidden; font-family: 'Cairo', sans-serif; color: white;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;">
                        <div>
                            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; background: linear-gradient(90deg, #3b82f6, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">مساعد المعادلة الفرنسية</h3>
                            <p style="margin: 2px 0 0 0; font-size: 0.6rem; color: rgba(255,255,255,0.3);">نموذج ذكاء اصطناعي للرد على أسئلة تتعلق بالأكاديمية فقط</p>
                        </div>
                        <button onclick="window.AppNavigate('home')" style="background: transparent; border: none; color: rgba(255,255,255,0.3); font-size: 1.5rem; cursor: pointer;">✕</button>
                    </div>

                    <div style="padding: 10px 0 8px 0; flex-shrink: 0; overflow-x: auto; white-space: nowrap; display: flex; gap: 8px; align-items: center; scrollbar-width: thin; min-height: 40px;">
                        ${faqData.map(item => `
                            <button onclick="window.askSuggested('${item.q.replace(/'/g, "\\'")}')" 
                                    style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 30px; padding: 5px 14px; color: rgba(255,255,255,0.7); font-size: 0.7rem; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px); flex-shrink: 0;"
                                    onmouseover="this.style.background='rgba(255,255,255,0.1)'; this.style.borderColor='rgba(59,130,246,0.4)';"
                                    onmouseout="this.style.background='rgba(255,255,255,0.04)'; this.style.borderColor='rgba(255,255,255,0.06)';">
                                ${item.q}
                            </button>
                        `).join('')}
                    </div>

                    <div id="aiChatMessages" style="flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 8px 0 8px 0; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;">
                        <div class="ai-chat-message bot" style="flex-shrink: 0; background: rgba(255,255,255,0.04); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; border-bottom-left-radius: 4px; padding: 10px 14px; max-width: 85%; align-self: flex-start; font-size: 0.85rem; line-height: 1.6; color: #e5e7eb;">
                            <span>👋 مرحباً بك! اسألني أي شيء عن المعادلة الفرنسية، المواد، الامتحان، أو الاشتراك.</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;">
                        <input id="aiChatInput" type="text" placeholder="اكتب سؤالك هنا..." 
                               style="flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 50px; padding: 8px 16px; color: white; font-size: 0.85rem; outline: none; transition: border 0.2s;"
                               onfocus="this.style.borderColor='rgba(59,130,246,0.5)'"

                               onkeydown="if(event.key==='Enter') window.handleSendQuestion()" />
                        <button onclick="window.handleSendQuestion()" 
                                style="background: linear-gradient(135deg, #1e3a8a, #2563eb); border: none; border-radius: 50px; padding: 8px 20px; color: white; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.transform='scale(1.03)'"

                    <style>

                            background: rgba(255,255,255,0.04);

                            border: 1px solid rgba(255,255,255,0.06);
                            border-radius: 18px;
                            border-bottom-left-radius: 4px;
                            padding: 10px 16px;
                            align-self: flex-start;
                            font-size: 0.85rem;
                            line-height: 1.6;
                            color: #e5e7eb;

                        @keyframes fadeIn {

            }

            // ============================================================

            function init() {

    <!-- ============================================================
    مشغلات الفيديو (YouTube IFrame API)
    ============================================================ -->
    <script>
        // ============================================================
        // 1. مشغلات الفيديو
        // ============================================================
        var players = {
            1: null,
            2: null,
            3: null
        };
        var playerStates = {
            1: { zoom: 1, volume: 100, muted: false, speed: 1, currentTime: 0, duration: 0, isPlaying: false },
            2: { zoom: 1, volume: 100, muted: false, speed: 1, currentTime: 0, duration: 0, isPlaying: false },
            3: { zoom: 1, volume: 100, muted: false, speed: 1, currentTime: 0, duration: 0, isPlaying: false }
        };
        var progressIntervals = {};

        function onYouTubeIframeAPIReady() {
            console.log('YouTube API ready, waiting for players...');
        }

        window.initVideoPlayers = function() {
            if (!document.getElementById('player_1') || !document.getElementById('player_2') || !document.getElementById('player_3')) {
                console.warn('Players not found in DOM, retrying...');
                setTimeout(window.initVideoPlayers, 500);
                return;
            }

            console.log('Initializing video players...');

            players[1] = new YT.Player('player_1', {
                videoId: 'uPW_vR_eJ1M',
                playerVars: { controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1 },
                events: {
                    onReady: function(e) { onPlayerReady(1, e); },
                    onStateChange: function(e) { onPlayerStateChange(1, e); },
                    onError: function(e) { showToast('⚠️ حدث خطأ في الفيديو الأول'); }
                }
            });
            players[2] = new YT.Player('player_2', {
                videoId: 'R76qgz_ooMk',
                playerVars: { controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1 },
                events: {
                    onReady: function(e) { onPlayerReady(2, e); },
                    onStateChange: function(e) { onPlayerStateChange(2, e); },
                    onError: function(e) { showToast('⚠️ حدث خطأ في الفيديو الثاني'); }
                }
            });
            players[3] = new YT.Player('player_3', {
                videoId: 'ru61DG3x2Q4',
                playerVars: { controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1 },
                events: {
                    onReady: function(e) { onPlayerReady(3, e); },
                    onStateChange: function(e) { onPlayerStateChange(3, e); },
                    onError: function(e) { showToast('⚠️ حدث خطأ في الفيديو الثالث'); }
                }
            });

            bindPlayerControls();
        };

        function onPlayerReady(id, event) {
            var state = playerStates[id];
            state.duration = event.target.getDuration();
            updateTotalTime(id);
            event.target.setVolume(state.volume);
            document.getElementById('volumeSlider_' + id).value = state.volume;
            document.getElementById('loading_' + id).classList.remove('active');
            startProgressUpdater(id);
        }

        function onPlayerStateChange(id, event) {
            var state = playerStates[id];
            var data = event.data;
            if (data === YT.PlayerState.PLAYING) {
                state.isPlaying = true;
                document.getElementById('playBtn_' + id).textContent = '⏸';
                document.getElementById('loading_' + id).classList.remove('active');
            } else if (data === YT.PlayerState.PAUSED) {
                state.isPlaying = false;
                document.getElementById('playBtn_' + id).textContent = '▶';
            } else if (data === YT.PlayerState.ENDED) {
                state.isPlaying = false;
                document.getElementById('playBtn_' + id).textContent = '▶';
                document.getElementById('progressFill_' + id).style.width = '100%';
            } else if (data === YT.PlayerState.BUFFERING) {
                document.getElementById('loading_' + id).classList.add('active');
            } else if (data === YT.PlayerState.CUED) {
                document.getElementById('loading_' + id).classList.remove('active');
            }
        }

        function startProgressUpdater(id) {
            if (progressIntervals[id]) clearInterval(progressIntervals[id]);
            progressIntervals[id] = setInterval(function() {
                var player = players[id];
                if (!player || !player.getCurrentTime) return;
                var current = player.getCurrentTime();
                var duration = player.getDuration();
                if (duration > 0) {
                    var percent = (current / duration) * 100;
                    var fill = document.getElementById('progressFill_' + id);
                    var thumb = document.querySelector('#wrapper_' + id + ' .progress-thumb');
                    var timeEl = document.getElementById('currentTime_' + id);
                    
                    if (fill) fill.style.width = Math.min(percent, 100) + '%';
                    
                    if (thumb) {
                        thumb.style.left = Math.min(percent, 100) + '%';
                        thumb.style.transform = 'translate(-50%, -50%)';
                    }
                    
                    if (timeEl) timeEl.textContent = formatTime(current);
                    
                    playerStates[id].currentTime = current;
                    playerStates[id].duration = duration;
                }
            }, 250);
        }

        function updateTotalTime(id) {
            var duration = playerStates[id].duration;
            if (duration) {
                document.getElementById('totalTime_' + id).textContent = formatTime(duration);
            }
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '00:00';
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        // ============================================================
        // 2. دوال التحكم لكل مشغل
        // ============================================================
        function playVideo(id) { if (players[id]) players[id].playVideo(); }
        function pauseVideo(id) { if (players[id]) players[id].pauseVideo(); }
        function togglePlay(id) {
            if (playerStates[id].isPlaying) {
                pauseVideo(id);
            } else {
                playVideo(id);
            }
        }
        function seek(id, seconds) {
            var player = players[id];
            if (!player) return;
            var current = player.getCurrentTime();
            var duration = player.getDuration();
            var newTime = Math.min(Math.max(current + seconds, 0), duration);
            player.seekTo(newTime, true);
        }
        function changeSpeed(id, rate) {
            var player = players[id];
            if (!player) return;
            player.setPlaybackRate(rate);
            playerStates[id].speed = rate;
            document.getElementById('speedBtn_' + id).textContent = rate.toFixed(1) + '×';
        }
        function toggleMute(id) {
            var player = players[id];
            if (!player) return;
            var state = playerStates[id];
            state.muted = !state.muted;
            player.setMute(state.muted);
            document.getElementById('muteBtn_' + id).textContent = state.muted ? '🔇' : '🔊';
            document.getElementById('volumeSlider_' + id).value = state.muted ? 0 : state.volume;
        }
        function setVolume(id, val) {
            var player = players[id];
            var vol = parseInt(val);
            var state = playerStates[id];
            state.volume = vol;
            if (player) {
                player.setVolume(vol);
                if (vol === 0) {
                    state.muted = true;
                    document.getElementById('muteBtn_' + id).textContent = '🔇';
                } else {
                    state.muted = false;
                    document.getElementById('muteBtn_' + id).textContent = '🔊';
                    player.unMute();
                }
            }
        }
        function setZoom(id, level) {
            var wrapper = document.getElementById('wrapper_' + id);
            if (!wrapper) return;
            var newLevel = Math.min(Math.max(level, 0.5), 2.0);
            playerStates[id].zoom = newLevel;
            wrapper.style.transform = 'scale(' + newLevel + ')';
        }
        function resetZoom(id) { setZoom(id, 1); }

        // ============================================================
        // دالة toggleFullscreen
        // ============================================================
        function toggleFullscreen(id) {
            var wrapper = document.getElementById('wrapper_' + id);
            if (!wrapper) {
                console.warn('⚠️ لم يتم العثور على wrapper_' + id);
                return;
            }
            
            var videoElement = wrapper.querySelector('video') || wrapper.querySelector('iframe');
            
            if (videoElement && videoElement.webkitEnterFullscreen) {
                try {
                    videoElement.webkitEnterFullscreen();
                    return;
                } catch (e) {
                    console.warn('iOS fullscreen failed, trying fallback');
                }
            }
            
            var container = wrapper.closest('.glass.p-4.rounded-3xl.relative.overflow-hidden.group.shadow-2xl') || wrapper;
            
            var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            
            if (!isFullscreen) {
                var req = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
                if (req) {
                    try {
                        req.call(container);
                    } catch (e) {
                        if (videoElement && videoElement.requestFullscreen) {
                            videoElement.requestFullscreen();
                        } else if (videoElement && videoElement.webkitRequestFullscreen) {
                            videoElement.webkitRequestFullscreen();
                        }
                    }
                }
            } else {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) {
                    try {
                        exit.call(document);
                    } catch (e) {
                        console.warn('Exit fullscreen failed:', e);
                    }
                }
            }
        }

        // ============================================================
        // دالة bindPlayerControls
        // ============================================================
        function bindPlayerControls() {
            for (var i = 1; i <= 3; i++) {
                (function(id) {
                    var playBtn = document.getElementById('playBtn_' + id);
                    var rewindBtn = document.getElementById('rewindBtn_' + id);
                    var forwardBtn = document.getElementById('forwardBtn_' + id);
                    var speedBtn = document.getElementById('speedBtn_' + id);
                    var muteBtn = document.getElementById('muteBtn_' + id);
                    var volumeSlider = document.getElementById('volumeSlider_' + id);
                    var zoomInBtn = document.getElementById('zoomInBtn_' + id);
                    var zoomOutBtn = document.getElementById('zoomOutBtn_' + id);
                    var resetZoomBtn = document.getElementById('resetZoomBtn_' + id);
                    var fullscreenBtn = document.getElementById('fullscreenBtn_' + id);
                    var progressTrack = document.getElementById('progressTrack_' + id);
                    var progressFill = document.getElementById('progressFill_' + id);
                    var currentTimeEl = document.getElementById('currentTime_' + id);
                    var totalTimeEl = document.getElementById('totalTime_' + id);

                    if (playBtn) playBtn.addEventListener('click', function() { togglePlay(id); });
                    if (rewindBtn) rewindBtn.addEventListener('click', function() { seek(id, -5); });
                    if (forwardBtn) forwardBtn.addEventListener('click', function() { seek(id, 5); });
                    if (speedBtn) {
                        speedBtn.addEventListener('click', function() {
                            var speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
                            var current = playerStates[id].speed;
                            var idx = speeds.indexOf(current);
                            idx = (idx + 1) % speeds.length;
                            changeSpeed(id, speeds[idx]);
                        });
                    }
                    if (muteBtn) muteBtn.addEventListener('click', function() { toggleMute(id); });
                    if (volumeSlider) {
                        volumeSlider.addEventListener('input', function(e) {
                            setVolume(id, e.target.value);
                        });
                    }
                    if (zoomInBtn) zoomInBtn.addEventListener('click', function() {
                        setZoom(id, playerStates[id].zoom + 0.15);
                    });
                    if (zoomOutBtn) zoomOutBtn.addEventListener('click', function() {
                        setZoom(id, playerStates[id].zoom - 0.15);
                    });
                    if (resetZoomBtn) resetZoomBtn.addEventListener('click', function() { resetZoom(id); });
                    if (fullscreenBtn) fullscreenBtn.addEventListener('click', function() { toggleFullscreen(id); });

                    // ===== شريط التقدم =====
                    if (progressTrack && progressFill) {
                        var thumb = document.createElement('div');
                        thumb.className = 'progress-thumb';
                        thumb.style.cssText = `
                            position: absolute;
                            top: 50%;
                            left: 0%;
                            transform: translate(-50%, -50%);
                            width: 18px;
                            height: 18px;
                            background: #f97316;
                            border-radius: 50%;
                            box-shadow: 0 0 16px rgba(249, 115, 22, 0.6);
                            z-index: 5;
                            pointer-events: none;
                            opacity: 0;
                            transition: opacity 0.15s;
                        `;
                        progressTrack.style.position = 'relative';
                        progressTrack.style.direction = 'ltr';
                        progressTrack.style.overflow = 'visible';
                        progressTrack.appendChild(thumb);

                        progressTrack.addEventListener('mouseenter', function() {
                            thumb.style.opacity = '1';
                        });
                        progressTrack.addEventListener('mouseleave', function() {
                            if (!isDragging) thumb.style.opacity = '0';
                        });

                        var isDragging = false;
                        var isHovering = false;

                        function getSeekPercent(e) {
                            var rect = progressTrack.getBoundingClientRect();
                            var x = (e.clientX - rect.left) / rect.width;
                            return Math.min(Math.max(x, 0), 1);
                        }

                        function getSeekPercentTouch(e) {
                            var touch = e.touches[0];
                            var rect = progressTrack.getBoundingClientRect();
                            var x = (touch.clientX - rect.left) / rect.width;
                            return Math.min(Math.max(x, 0), 1);
                        }

                        function updateSeek(percent) {
                            var player = players[id];
                            if (!player) return;
                            var duration = player.getDuration();
                            if (!duration) return;
                            var seekTime = percent * duration;
                            
                            progressFill.style.width = (percent * 100) + '%';
                            thumb.style.left = (percent * 100) + '%';
                            thumb.style.transform = 'translate(-50%, -50%)';
                            
                            if (currentTimeEl) {
                                currentTimeEl.textContent = formatTime(seekTime);
                            }
                        }

                        function applySeek(percent) {
                            var player = players[id];
                            if (!player) return;
                            var duration = player.getDuration();
                            if (!duration) return;
                            var seekTime = percent * duration;
                            player.seekTo(seekTime, true);
                        }

                        progressTrack.addEventListener('mousedown', function(e) {
                            isDragging = true;
                            thumb.style.opacity = '1';
                            progressTrack.style.cursor = 'grabbing';
                            
                            var percent = getSeekPercent(e);
                            updateSeek(percent);
                            applySeek(percent);
                            
                            if (progressIntervals[id]) {
                                clearInterval(progressIntervals[id]);
                                progressIntervals[id] = null;
                            }
                            
                            e.preventDefault();
                        });

                        document.addEventListener('mousemove', function(e) {
                            if (!isDragging) return;
                            var percent = getSeekPercent(e);
                            updateSeek(percent);
                            applySeek(percent);
                        });

                        document.addEventListener('mouseup', function(e) {
                            if (!isDragging) return;
                            isDragging = false;
                            progressTrack.style.cursor = 'pointer';
                            
                            var percent = getSeekPercent(e);
                            applySeek(percent);
                            
                            if (!progressIntervals[id]) {
                                startProgressUpdater(id);
                            }
                            
                            if (!isHovering) {
                                thumb.style.opacity = '0';
                            }
                        });

                        progressTrack.addEventListener('touchstart', function(e) {
                            isDragging = true;
                            thumb.style.opacity = '1';
                            
                            var percent = getSeekPercentTouch(e);
                            updateSeek(percent);
                            applySeek(percent);
                            
                            if (progressIntervals[id]) {
                                clearInterval(progressIntervals[id]);
                                progressIntervals[id] = null;
                            }
                            
                            e.preventDefault();
                        }, { passive: false });

                        document.addEventListener('touchmove', function(e) {
                            if (!isDragging) return;
                            var percent = getSeekPercentTouch(e);
                            updateSeek(percent);
                            applySeek(percent);
                            e.preventDefault();
                        }, { passive: false });

                        document.addEventListener('touchend', function(e) {
                            if (!isDragging) return;
                            isDragging = false;
                            
                            var percent = getSeekPercentTouch(e);
                            applySeek(percent);
                            
                            if (!progressIntervals[id]) {
                                startProgressUpdater(id);
                            }
                            
                            thumb.style.opacity = '0';
                        });

                        progressTrack.addEventListener('click', function(e) {
                            if (isDragging) return;
                            var percent = getSeekPercent(e);
                            updateSeek(percent);
                            applySeek(percent);
                        });

                        progressTrack.addEventListener('mouseenter', function() {
                            isHovering = true;
                            thumb.style.opacity = '1';
                        });
                        progressTrack.addEventListener('mouseleave', function() {
                            isHovering = false;
                            if (!isDragging) {
                                thumb.style.opacity = '0';
                            }
                        });

                        console.log('✅ شريط التقدم مثل YouTube للمشغل ' + id);
                    }
                })(i);
            }
        }

        // ============================================================
        // دالة التحكم في جودة الفيديو
        // ============================================================
        function setVideoQuality(quality) {
            for (var i = 1; i <= 3; i++) {
                if (players[i]) {
                    try {
                        players[i].setPlaybackQuality(quality);
                        console.log('✅ تم تغيير جودة المشغل ' + i + ' إلى: ' + quality);
                    } catch (e) {
                        console.warn('⚠️ لا يمكن تغيير جودة المشغل ' + i + ': ' + e.message);
                    }
                }
            }
            var qualityNames = {
                'hd1080': '1080p',
                'hd720': '720p',
                'large': 'جودة عالية',
                'medium': 'جودة متوسطة',
                'small': 'جودة منخفضة'
            };
            showToast('🎬 جودة الفيديو: ' + (qualityNames[quality] || quality));
        }

        // ============================================================
        // 4. الإشعارات (Toast)
        // ============================================================
        function showToast(message, duration) {
            duration = duration || 1400;
            var container = document.getElementById('toastContainer');
            if (!container) {
                var div = document.createElement('div');
                div.id = 'toastContainer';
                div.className = 'toast-container';
                div.style.bottom = '20px';
                div.style.top = 'auto';
                div.style.left = '50%';
                div.style.transform = 'translateX(-50%)';
                div.style.position = 'fixed';
                div.style.zIndex = '9999';
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'center';
                div.style.gap = '8px';
                div.style.pointerEvents = 'none';
                document.body.appendChild(div);
                container = div;
            }
            var toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toast.style.background = '#22c55e';
            toast.style.color = '#ffffff';
            toast.style.border = '1px solid #16a34a';
            toast.style.boxShadow = '0 8px 30px rgba(34,197,94,0.4)';
            toast.style.borderRadius = '40px';
            toast.style.padding = '10px 24px';
            toast.style.fontSize = '0.95rem';
            toast.style.fontWeight = '500';
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px) scale(0.95)';
            toast.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            toast.style.pointerEvents = 'none';
            toast.style.whiteSpace = 'nowrap';
            toast.style.direction = 'ltr';
            container.appendChild(toast);
            requestAnimationFrame(function() {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0) scale(1)';
            });
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px) scale(0.95)';
                setTimeout(function() { toast.remove(); }, 400);
            }, duration);
        }

        function showCenteredBigToast(message, duration = 2000) {
            var old = document.getElementById('bigCenteredToast');
            if (old) old.remove();

            var container = document.createElement('div');
            container.id = 'bigCenteredToast';
            container.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.9);
                background: rgba(0,0,0,0.95);
                backdrop-filter: blur(12px);
                color: #fff;
                padding: 35px 45px;
                border-radius: 24px;
                font-size: 1.3rem;
                font-weight: 500;
                border: 2px solid #f97316;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
                z-index: 10000;
                text-align: center;
                max-width: 90%;
                width: auto;
                min-width: 320px;
                opacity: 0;
                transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                pointer-events: none;
                white-space: pre-line;
                direction: rtl;
                font-family: 'Cairo', sans-serif;
                line-height: 2;
                letter-spacing: 0.5px;
                border-radius: 30px;
            `;
            container.textContent = message;
            document.body.appendChild(container);

            requestAnimationFrame(() => {
                container.style.opacity = '1';
                container.style.transform = 'translate(-50%, -50%) scale(1)';
            });

            setTimeout(() => {
                container.style.opacity = '0';
                container.style.transform = 'translate(-50%, -50%) scale(0.9)';
                setTimeout(() => container.remove(), 400);
            }, duration);
        }

        // ============================================================
        // 5. اختصارات لوحة المفاتيح
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            var id = 1;
            switch (e.key) {
                case ' ':
                case 'Space':
                    e.preventDefault();
                    togglePlay(id);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    seek(id, 5);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    seek(id, -5);
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    toggleFullscreen(id);
                    break;
                case 'm':
                case 'M':
                    e.preventDefault();
                    toggleMute(id);
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    resetZoom(id);
                    break;
            }
        });

        // ============================================================
        // 6. كود تفعيل PWA
        // ============================================================
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('✅ PWA installation prompt available');
        });

        window.installPWA = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User accepted the PWA install');
                        showToast('✅ تم تثبيت التطبيق بنجاح!');
                    } else {
                        console.log('❌ User dismissed the PWA install');
                        showToast('❌ تم إلغاء التثبيت');
                    }
                    deferredPrompt = null;
                });
            } else {
                showToast('📱 استخدم قائمة المتصفح لتثبيت التطبيق (انظر التعليمات أدناه)', 4000);
            }
        };

        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'installPwaBtn') {
                window.installPWA();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch(err => console.error('❌ Service Worker registration failed:', err));
        }

/**
 * CyberVanguard Ultra-Smooth Auto Scroll Engine
 * دالة التمرير التلقائي السلس المعتمدة على التسريع العتادي واستجابة الشاشة
 */
function enableAutoScroll() {
    const container = document.querySelector('.leaderboard-scroll');
    if (!container) return null;

    // 1. حقن أنماط CSS المتقدمة لضمان أداء السلاسة والتسريع عبر الـ GPU
    const styleId = 'cv-autoscroll-styles';
    if (!document.getElementById(styleId)) {
        const style = document.createElement('style');
        style.id = styleId;
        style.textContent = `
            .leaderboard-scroll {
                scroll-behavior: auto !important; /* إلغاء التداخل مع التمرير الناعم الافتراضي */
                will-change: scroll-position;    /* إعلام المتصفح بتهيئة كرت الشاشة لتحديث التمرير */
                contain: layout style paint;     /* معزول تماماً لتحسين أداء الرندر ومنع Reflow للصفحة */
                -webkit-overflow-scrolling: touch;
            }
        `;
        document.head.appendChild(style);
    }

    // 2. متغيرات التحكم في المحرك
    let animationFrameId = null;
    let isPaused = false;
    let direction = 1; // 1 = لليمين/للأسفل، -1 = لليار/للأعلى
    const speedPixelsPerSecond = 50; // السرعة بالبكسل في الثانية (عدّلها حسب رغبتك)
    let lastTimestamp = null;
    let touchTimeout = null;

    // 3. حلقة الحركة المتزامنة مع معدل تحديث الشاشة (requestAnimationFrame)
    function step(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const deltaTime = (timestamp - lastTimestamp) / 1000; // حساب الفارق الزمني بدقة متناهية
        lastTimestamp = timestamp;

        if (!isPaused) {
            const maxScroll = container.scrollWidth - container.clientWidth;
            if (maxScroll > 0) {
                let currentScroll = container.scrollLeft + (speedPixelsPerSecond * deltaTime * direction);

                if (currentScroll >= maxScroll) {
                    currentScroll = maxScroll;
                    direction = -1; // عكس الاتجاه عند الوصول للنهاية
                } else if (currentScroll <= 0) {
                    currentScroll = 0;
                    direction = 1;  // عكس الاتجاه عند الوصول للبداية
                }

                container.scrollLeft = currentScroll;
            }
        }

        animationFrameId = requestAnimationFrame(step);
    }

    // بدء تشغيل المحرك
    animationFrameId = requestAnimationFrame(step);

    // 4. معالجة الأحداث (Events) لإيقاف واستئناف الحركة بنظافة وبدون مشاكل memory leak
    const pauseScroll = () => { isPaused = true; };
    const resumeScroll = () => {
        lastTimestamp = null; // إعادة ضبط التوقيت لتفادي القفزات المفاجئة
        isPaused = false;
    };

    container.addEventListener('mouseenter', pauseScroll);
    container.addEventListener('mouseleave', resumeScroll);

    container.addEventListener('touchstart', () => {
        if (touchTimeout) clearTimeout(touchTimeout);
        pauseScroll();
    }, { passive: true });

    container.addEventListener('touchend', () => {
        touchTimeout = setTimeout(resumeScroll, 2500); // استئناف الحركة بعد 2.5 ثانية من ترك اللمس
    }, { passive: true });

    // 5. إرجاع دالة تنظيف (Clean-up) لإلغاء المراقبة والتأثيرات عند الحاجة
    return function destroy() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (touchTimeout) clearTimeout(touchTimeout);
        container.removeEventListener('mouseenter', pauseScroll);
        container.removeEventListener('mouseleave', resumeScroll);
    };
}

        // ============================================================
        // 7. إصلاح مشكلة لوحة المفاتيح في شات الذكاء الاصطناعي
        // ============================================================
        function fixAIChatKeyboard() {
            const container = document.getElementById('aiChatContainer');
            if (!container) return;

            function setHeight() {
                if (window.visualViewport) {
                    container.style.height = (window.visualViewport.height) + 'px';
                } else {
                    container.style.height = window.innerHeight + 'px';
                }
            }

            setHeight();

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    setHeight();
                    const messages = document.getElementById('aiChatMessages');
                    if (messages) {
                        setTimeout(() => {
                            messages.scrollTop = messages.scrollHeight;
                        }, 100);
                    }
                });
            }

            const input = document.getElementById('aiChatInput');
            if (input) {
                input.addEventListener('focus', function() {
                    setTimeout(() => {
                        const messages = document.getElementById('aiChatMessages');
                        if (messages) {
                            messages.scrollTop = messages.scrollHeight;
                        }
                        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                });
                
                input.addEventListener('blur', function() {
                    setTimeout(setHeight, 300);
                });
            }
        }

        // ============================================================
        // 8. ربط الأحداث بعد تحميل الصفحة
        // ============================================================
        window.addEventListener('load', function() {
            fixAIChatKeyboard();
            console.log('✅ مشغلات الفيديو جاهزة للتهيئة.');
        });
